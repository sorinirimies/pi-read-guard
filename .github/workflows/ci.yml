name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch / PR supersedes a stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The same gate `just check` and the release run: typecheck + tests + pack + nu tests.
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install nushell
        uses: hustcer/setup-nu@v3
        with:
          version: "0.111.0"

      - run: bun install --frozen-lockfile

      - name: Quality gate
        run: nu scripts/ci/quality_gate.nu

  # Paths and terminals differ: run the suite where users run pi.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest }
          - { os: windows-latest }
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: bun test
        run: bun test
